tomcat:
  threads:
    max: 200 # Mặc định
    min-spare: 20
  accept-count: 5000 # Hàng đợi TCP khi full thread (Quan trọng khi burst traffic)
  max-connections: 20000 # Cho phép 20k kết nối (QUAN TRỌNG)

spring:
  application:
    name: migrate
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          batch_size: 50
          fetch_size: 100
          order_inserts: true
          order_updates: true
  datasource:
    url: jdbc:sqlserver://172.31.19.160:1433;databaseName=StackOverflow2010;encrypt=true;trustServerCertificate=true;
    username: sa
    password: YourStrong!Passw0rd
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
  elasticsearch:
    uris: http://172.31.22.44:9200
    socket-timeout: 30s
  data:
    redis:
      cluster:
        nodes:
          - 172.31.28.123:6379
          - 172.31.28.199:6379
          - 172.31.17.240:6379
          - 172.31.28.123:6380
          - 172.31.28.199:6380
          - 172.31.17.240:6380
      lettuce:
        pool:
          max-active: 30
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms
        cluster:
          refresh:
            adaptive: true
            period: 60
resilience4j:
  circuitbreaker:
    instances:
      esSearch:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - '*'
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name} # Gắn tag application="migrate" cho mọi metric
    distribution:
      percentiles-histogram:
        http.server.requests: true